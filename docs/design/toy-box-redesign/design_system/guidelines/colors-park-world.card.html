<!-- @dsCard group="Colors" viewport="700x190" subtitle="One panel colour per park, never a gradient" name="Park colours — International" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-ui);color:var(--text-primary);box-sizing:border-box}*{box-sizing:border-box}</style>
</head><body>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--park-tokyo-disneyland)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">TOKYO DL</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#C62828</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--park-tokyo-disneysea)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">DISNEYSEA</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#1565C0</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--park-paris)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">PARIS</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#7B1FA2</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--park-walt-disney-studios)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">WDS PARIS</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#D32F2F</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--park-hong-kong)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">HONG KONG</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#00796B</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--park-shanghai)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">SHANGHAI</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#1A237E</div>
</div>
</div>
</body></html>
