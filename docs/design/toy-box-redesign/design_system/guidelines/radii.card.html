<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-ui);color:var(--text-primary);box-sizing:border-box}*{box-sizing:border-box}</style>
</head><body>
<div style="display:flex;gap:12px;align-items:flex-end">
  <div style="text-align:center"><div style="width:78px;height:78px;background:var(--surface);border-radius:9px"></div><div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted);margin-top:6px">check 9</div></div><div style="text-align:center"><div style="width:78px;height:78px;background:var(--surface);border-radius:14px"></div><div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted);margin-top:6px">control 14</div></div><div style="text-align:center"><div style="width:78px;height:78px;background:var(--surface);border-radius:16px"></div><div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted);margin-top:6px">chip 16</div></div><div style="text-align:center"><div style="width:78px;height:78px;background:var(--surface);border-radius:22px"></div><div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted);margin-top:6px">tile-sm 22</div></div><div style="text-align:center"><div style="width:78px;height:78px;background:var(--surface);border-radius:26px"></div><div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted);margin-top:6px">tile 26</div></div><div style="text-align:center"><div style="width:78px;height:78px;background:var(--surface);border-radius:30px"></div><div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted);margin-top:6px">card 30</div></div><div style="text-align:center"><div style="width:78px;height:78px;background:var(--surface);border-radius:34px"></div><div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted);margin-top:6px">hero 34</div></div>
</div>
</body></html>
