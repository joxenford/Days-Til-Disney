<!-- @dsCard group="Colors" viewport="700x190" subtitle="Never pure black; ink never pure white" name="Dark surfaces" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-ui);color:var(--text-primary);box-sizing:border-box}*{box-sizing:border-box}</style>
</head><body>
<div style="display:flex;gap:10px;flex-wrap:wrap;background:var(--dark-bg);padding:14px;border-radius:var(--radius-tile);color:var(--dark-ink)">
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--dark-bg)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">PAGE</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#15151A</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--dark-surface)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">TILE</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#202028</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--dark-raised)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">RAISED</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#26262E</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--dark-hairline)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">HAIRLINE</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#2E2E38</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--dark-ink)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">INK</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#F1F1EF</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--dark-ink-muted)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">MUTED</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#9A99A2</div>
</div>
</div>
</body></html>
