<!-- @dsCard group="Spacing" viewport="700x260" subtitle="Park panel anchors, tiles follow" name="Tile stack in use" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-ui);color:var(--text-primary);box-sizing:border-box}*{box-sizing:border-box}</style>
</head><body>
<div style="width:340px;display:flex;flex-direction:column;gap:12px">
  <div style="background:var(--accent);border-radius:var(--radius-hero);padding:20px 22px">
    <div style="font-size:11px;font-weight:700;letter-spacing:1.6px;color:rgba(255,255,255,.78)">MAGIC KINGDOM</div>
    <div style="margin-top:10px;display:flex;align-items:baseline;gap:8px"><span style="font-size:76px;font-weight:800;letter-spacing:-5px;line-height:.84;color:#fff">45</span><span style="font-size:18px;font-weight:600;color:rgba(255,255,255,.82)">days</span></div>
  </div>
  <div style="display:flex;gap:12px">
    <div style="flex:1;background:var(--surface);border-radius:var(--radius-tile);padding:16px"><div style="font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--text-muted)">PACKED</div><div style="margin-top:6px;font-size:32px;font-weight:800;letter-spacing:-1.6px">12<span style="font-size:16px;color:var(--text-faint)">/38</span></div></div>
    <div style="flex:1;background:var(--surface);border-radius:var(--radius-tile);padding:16px"><div style="font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--text-muted)">NEXT UP</div><div style="margin-top:6px;font-size:32px;font-weight:800;letter-spacing:-1.6px">30</div></div>
  </div>
</div>
</body></html>
