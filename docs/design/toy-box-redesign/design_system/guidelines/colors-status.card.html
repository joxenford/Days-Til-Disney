<!-- @dsCard group="Colors" viewport="700x190" subtitle="Wait-time and availability colours" name="Status + accent" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-ui);color:var(--text-primary);box-sizing:border-box}*{box-sizing:border-box}</style>
</head><body>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--status-operating)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">OPERATING</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#4CAF50</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--status-wait-long)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">LONG WAIT</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#FF6B6B</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--status-refurb)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">REFURB</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#FF9800</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--status-closed)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">CLOSED</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#F44336</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--gold)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">GOLD</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#E8C84A</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--gold-deep)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">GOLD DEEP</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#C9A84C</div>
</div>
</div>
</body></html>
