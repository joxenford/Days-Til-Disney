<!-- @dsCard group="Colors" viewport="700x190" subtitle="Four steps: page, tile, raised, control" name="Light surfaces" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-ui);color:var(--text-primary);box-sizing:border-box}*{box-sizing:border-box}</style>
</head><body>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--light-bg)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">PAGE</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#F3F3F1</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--light-surface)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">TILE</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#E7E7E3</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--light-raised)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">RAISED</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#FFFFFF</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--light-control)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">CONTROL</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#E4E4E0</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--light-hairline)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">HAIRLINE</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#D2D2CD</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:96px">
  <div style="height:52px;border-radius:var(--radius-chip);background:var(--light-ink)"></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:.6px">INK</div>
  <div style="font-family:var(--font-prose);font-size:11px;color:var(--text-muted)">#1B1B1F</div>
</div>
</div>
</body></html>
