<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Twilight sky gradient: deep indigo top -> vivid violet bottom -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#12102E"/>
      <stop offset="35%" stop-color="#1E1B4B"/>
      <stop offset="72%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Marigold body with lighter core for dimension -->
    <radialGradient id="star" cx="50%" cy="42%" r="62%">
      <stop offset="0%"  stop-color="#FFE9A8"/>
      <stop offset="45%" stop-color="#FFD457"/>
      <stop offset="100%" stop-color="#FFC93C"/>
    </radialGradient>

    <!-- Soft marigold glow to lift the mark off the deep sky -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFC93C" stop-opacity="0.55"/>
      <stop offset="40%"  stop-color="#FFC93C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFC93C" stop-opacity="0"/>
    </radialGradient>

    <!-- Comet trail: full marigold at the head, fading to nothing at the tail -->
    <linearGradient id="trail" x1="0.60" y1="0.44" x2="0.24" y2="0.78">
      <stop offset="0%"   stop-color="#FFD457" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#FFC93C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFC93C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background (iOS applies the squircle mask) -->
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- Mark group, centered within the icon -->
  <g transform="translate(-30,72)">
    <!-- Glow behind the star head -->
    <circle cx="600" cy="440" r="300" fill="url(#glow)"/>

    <!-- Comet trail (drawn under the star). Head near the star, tapering to a point down-left. -->
    <path d="M 636 522
             Q 480 648 250 800
             Q 424 556 512 402 Z"
          fill="url(#trail)"/>

    <!-- Four-point sparkle 'Wish' star. Control points at the center create the concave pinch. -->
    <path d="M 600 282
             Q 600 440 762 440
             Q 600 440 600 598
             Q 600 440 438 440
             Q 600 440 600 282 Z"
          fill="url(#star)"/>
  </g>
</svg>
