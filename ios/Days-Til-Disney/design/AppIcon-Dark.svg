<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark variant: darker end of the Twilight gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#080614"/>
      <stop offset="40%"  stop-color="#12102E"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <radialGradient id="star" cx="50%" cy="42%" r="62%">
      <stop offset="0%"  stop-color="#FFE9A8"/>
      <stop offset="45%" stop-color="#FFD457"/>
      <stop offset="100%" stop-color="#FFC93C"/>
    </radialGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFC93C" stop-opacity="0.45"/>
      <stop offset="40%"  stop-color="#FFC93C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFC93C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="trail" x1="0.60" y1="0.44" x2="0.24" y2="0.78">
      <stop offset="0%"   stop-color="#FFD457" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#FFC93C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFC93C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>

  <g transform="translate(-30,72)">
    <circle cx="600" cy="440" r="300" fill="url(#glow)"/>
    <path d="M 636 522
             Q 480 648 250 800
             Q 424 556 512 402 Z"
          fill="url(#trail)"/>
    <path d="M 600 282
             Q 600 440 762 440
             Q 600 440 600 598
             Q 600 440 438 440
             Q 600 440 600 282 Z"
          fill="url(#star)"/>
  </g>
</svg>
