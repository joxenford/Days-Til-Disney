<!-- TODO: new mark from design: replace this placeholder with the real Countdown to Magic icon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D2545"/>
      <stop offset="55%" stop-color="#1A1147"/>
      <stop offset="100%" stop-color="#0D1F3C"/>
    </linearGradient>
    <linearGradient id="spark" x1="256" y1="90" x2="256" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE780"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Stars -->
  <circle cx="78" cy="62" r="2" fill="#FFE780" opacity="0.5"/>
  <circle cx="384" cy="42" r="2" fill="#FFE780" opacity="0.4"/>
  <circle cx="435" cy="92" r="2" fill="#FFE780" opacity="0.5"/>
  <circle cx="205" cy="440" r="1.5" fill="#FFE780" opacity="0.35"/>
  <circle cx="330" cy="450" r="1.5" fill="#FFE780" opacity="0.4"/>

  <!-- Generic four-point sparkle mark (placeholder) -->
  <path d="M256 90
           C262 190, 278 230, 366 256
           C278 282, 262 322, 256 422
           C250 322, 234 282, 146 256
           C234 230, 250 190, 256 90 Z"
        fill="url(#spark)"/>
  <circle cx="360" cy="150" r="10" fill="#FFE780" opacity="0.8"/>
  <circle cx="152" cy="360" r="7" fill="#FFE780" opacity="0.7"/>
</svg>
